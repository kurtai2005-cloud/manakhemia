<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1030">

<title>微光小圃（原型）</title>
<style>
  :root { --warm:#ffd36a; --warm2:#f59a4a; --ink:#0b1030; --panel:rgba(14,20,52,.78); --line:#f2c27e; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin:0; height:100%; background:#05071a; overflow:hidden; touch-action:none;
    font-family:"Noto Sans CJK HK","Noto Sans HK","PingFang HK","Microsoft JhengHei","Noto Sans CJK TC",sans-serif; color:#fff2d8; }
  #app { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 40%, #151d4a 0%, #05071a 70%); }
  #stagewrap { position:relative; }
  #gl { display:block; image-rendering:pixelated; }
  #ui { position:absolute; left:0; top:0; width:390px; height:844px; transform-origin:0 0; overflow:hidden; }
  #hit { position:absolute; inset:0; touch-action:none; }
  .abs { position:absolute; }
  .panel { background:var(--panel); border:2px solid var(--line); border-radius:10px; box-shadow:0 0 0 2px rgba(11,16,48,.8), 0 4px 14px rgba(0,0,0,.4); backdrop-filter:blur(2px); }
  #hud { position:absolute; left:10px; right:10px; top:10px; pointer-events:none; }
  #chip { position:absolute; left:0; top:0; padding:5px 10px 6px; min-width:150px; pointer-events:none; }
  #chip b { font-size:14px; letter-spacing:1px; }
  #chip small { display:block; font-size:11px; opacity:.8; margin-top:1px; }
  #prog { height:5px; background:#0b1030; border-radius:3px; margin-top:4px; overflow:hidden; border:1px solid #6a5a3a; }
  #progf { height:100%; width:0; background:linear-gradient(90deg,#ffd36a,#ffb23a); }
  #top-r { position:absolute; right:0; top:0; display:flex; gap:6px; align-items:center; pointer-events:auto; }
  #grains { padding:6px 10px; font-size:14px; font-weight:700; color:var(--warm); }
  .ibtn { width:36px; height:36px; display:flex; align-items:center; justify-content:center; font-size:18px; cursor:pointer; color:var(--warm); }
  #needs { position:absolute; left:0; right:0; top:72px; display:flex; gap:6px; pointer-events:none; }
  .need { flex:1; padding:4px 6px 6px; }
  .need span { font-size:11px; display:block; opacity:.9; margin-bottom:3px; }
  .track { height:9px; background:#0b1030; border-radius:5px; overflow:hidden; border:1px solid #6a5a3a; position:relative; }
  .fill { height:100%; width:50%; background:var(--warm); transition:width .25s; }
  .fill.ok { background:var(--warm2); } .fill.warn { background:#ff6a6a; animation:pulse .9s infinite; }
  @keyframes pulse { 50% { opacity:.45; } }
  #bubble { position:absolute; left:50%; transform:translateX(-50%); padding:6px 12px; font-size:13px; white-space:nowrap; pointer-events:none; display:none;
    background:#fff6dc; color:#4a2e1a; border:2px solid #c0783f; border-radius:12px; }
  #bubble:after { content:""; position:absolute; left:50%; bottom:-9px; margin-left:-6px; border:6px solid transparent; border-top-color:#c0783f; border-bottom:0; }
  #bar { position:absolute; left:10px; right:10px; bottom:14px; display:flex; gap:8px; }
  .abtn { flex:1; height:74px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:13px; cursor:pointer; position:relative; }
  .abtn canvas { width:30px; height:30px; image-rendering:pixelated; }
  .abtn.dis { opacity:.4; }
  .abtn.hint { animation:glow 1.1s infinite; }
  @keyframes glow { 50% { box-shadow:0 0 14px 4px rgba(255,211,106,.8), 0 0 0 2px rgba(11,16,48,.8); } }
  #pop { position:absolute; left:10px; right:10px; bottom:98px; padding:8px; display:none; gap:6px; flex-direction:column; }
  .pitem { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; background:rgba(255,211,106,.12); cursor:pointer; font-size:14px; }
  .pitem:active { background:rgba(255,211,106,.35); }
  .pitem canvas { width:30px; height:30px; image-rendering:pixelated; }
  .pitem small { margin-left:auto; opacity:.75; font-size:11px; }
  #evcard { position:absolute; left:14px; right:14px; top:128px; padding:8px 12px 9px; display:none; pointer-events:none; text-align:center; z-index:12; font-size:13px; line-height:1.5; }
  #evcard #evicon { width:48px; height:48px; image-rendering:pixelated; display:block; margin:0 auto 2px; }
  #evcard b { display:block; color:var(--warm); font-size:15px; letter-spacing:2px; }
  #evcard small { display:block; margin-top:2px; color:var(--warm); font-size:12px; }
  #toast { position:absolute; left:50%; top:150px; transform:translateX(-50%); padding:7px 14px; font-size:13px; display:none; pointer-events:none; white-space:nowrap; }
  #modal { position:absolute; inset:0; background:rgba(5,7,26,.62); display:none; align-items:center; justify-content:center; z-index:20; }
  #mbox { width:322px; padding:18px 18px 14px; text-align:center; }
  #mbox h2 { margin:0 0 10px; font-size:19px; color:var(--warm); letter-spacing:2px; }
  #mbox p { margin:6px 0; font-size:14px; line-height:1.55; }
  .btn { display:inline-block; margin:12px 4px 0; padding:9px 22px; background:linear-gradient(#ffd36a,#f59a4a); color:#4a2410; font-weight:700; border-radius:9px; cursor:pointer; border:2px solid #fff0c0; font-size:15px; }
  .btn.sec { background:#2a3066; color:#ffe9b8; border-color:#6a5a8a; }
  .seg { display:flex; gap:4px; margin:6px 0; } .seg .btn { flex:1; margin:0; padding:7px 0; font-size:13px; }
  .seg .btn:not(.on) { background:#2a3066; color:#ffe9b8; border-color:#4a4a8a; }
  .row { display:flex; justify-content:space-between; align-items:center; margin:12px 0 2px; font-size:14px; text-align:left; }
  #mgHud { position:absolute; left:10px; right:10px; top:10px; display:none; pointer-events:none; }
  #mgHud .panel { display:inline-block; padding:6px 12px; font-size:15px; font-weight:700; }
  #mgQuit { position:absolute; right:0; top:0; pointer-events:auto; padding:6px 12px; font-size:13px; cursor:pointer; }
  #mgTimeBar { position:absolute; left:0; right:0; top:44px; height:8px; }
  #mgMsg { position:absolute; left:0; right:0; top:340px; text-align:center; font-size:34px; font-weight:800; color:#ffe27a; text-shadow:0 2px 0 #7a4a1a; display:none; pointer-events:none; }
  #dbgT { position:absolute; left:4px; top:136px; z-index:16; padding:2px 7px; font-size:10px; display:none; opacity:.7; cursor:pointer; }
  #dbg { position:absolute; left:4px; top:160px; width:196px; padding:6px; font-size:10.5px; z-index:15; display:none; max-height:560px; overflow:auto; }
  #dbg .g { margin-bottom:5px; line-height:1.9; } #dbg b { color:var(--warm); }
  #dbg button { font:inherit; font-size:10.5px; padding:2px 6px; margin:1px; background:#2a3066; color:#ffe9b8; border:1px solid #6a5a8a; border-radius:4px; }
  #dbg button.on { background:var(--warm2); color:#2a1000; }
  #dbg #dinfo { white-space:pre; font-family:monospace; font-size:10px; opacity:.9; }
</style>

    <canvas id="gl"></canvas>

      <div id="hit"></div>

    </div>
  </div>
</div>

<script>/* src/sim.js */
/* 《微光小圃》 sim.js — DOM-free 邏輯：需求、CQ、階段、離線推算、迷你遊戲、存檔序列化。
   可喺瀏覽器（window.Glimmer.sim）或 Node（require）使用。原創代碼。 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(require('./data.js'));
  else { root.Glimmer = root.Glimmer || {}; root.Glimmer.sim = factory(root.Glimmer.data); }
})(typeof self !== 'undefined' ? self : this, function (D) {
  'use strict';
  const P = D.PARAMS;
  const KEYS = D.NEED_KEYS;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ── 可設種子嘅 RNG（mulberry32）──
  function makeRng(seed) {
    let a = (seed >>> 0) || 1;
    const f = function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    f.getSeed = () => a;
    return f;
  }

  // ── step hook（方案 A：事件系統掛喺度；sim 本身唔依賴 events.js）──
  const stepHooks = [];
  function addStepHook(fn) { if (!stepHooks.includes(fn)) stepHooks.push(fn); }

  // ── 新存檔 ──
  function newState(nowMs, seed) {
    return {
      v: 1, createdAt: nowMs, lastSeen: nowMs, seed: seed || (nowMs % 1e9),
      stage: 'egg', form: null,
      needs: { hunger: 100, mood: 100, clean: 100, energy: 100 },
      sleeping: false, poops: 0, poopTimer: 0,
      growthSec: 0, ageSec: 0,
      cq: P.cqStart, cqTimer: 0,
      withdrawn: { on: false, fed: false, played: false },
      grains: 0,
      mg: { day: '', plays: 0, best: 0 },
      settings: { quality: 'high', autoSuggest: true, sound: true, volume: 'high' },
      stats: { hatches: 0, feeds: 0, plays: 0, rinses: 0, poopsCleared: 0, mgPlays: 0 },
      ev: [],
      evs: null,            // 事件系統狀態（events.js 惰性建立，會存檔）
    };
  }

  // ── 離線有效時間 E（GDD 第 7 節）──
  // E = min(T,8h)×100% + min(max(T−8h,0),16h)×25%；超過 24h 唔計。T<0 視為 0。
  function effectiveOffline(Tsec) {
    const T = Math.max(0, Tsec || 0);
    const H = 3600;
    const full = Math.min(T, P.offlineFullH * H);
    const disc = Math.min(Math.max(T - P.offlineFullH * H, 0), (P.offlineCapH - P.offlineFullH) * H);
    return full + disc * P.offlineDiscountRate;
  }

  function isUnwell(s) {
    if (s.stage === 'egg') return false;
    for (const k of KEYS) if (s.needs[k] < P.sickThreshold) return true;
    return false;
  }
  function lowestNeed(s) {
    let lk = KEYS[0];
    for (const k of KEYS) if (s.needs[k] < s.needs[lk]) lk = k;
    return lk;
  }
  function needBand(v) { return v > 60 ? 'good' : v >= 30 ? 'ok' : 'warn'; }

  function decideForm(cq) {
    return cq >= P.branchBright ? 'bright' : cq >= P.branchSoft ? 'soft' : 'dust';
  }

  function checkStage(s) {
    if (s.stage === 'egg' && s.growthSec >= P.stageSec.egg) {
      s.growthSec -= P.stageSec.egg;
      s.stage = 'sprout'; s.form = null;
      s.needs = Object.assign({}, P.startNeedsSprout);
      s.cq = P.cqStart; s.cqTimer = 0; s.stats.hatches++;
      s.ev.push({ type: 'hatch' });
    }
    if (s.stage === 'sprout' && s.growthSec >= P.stageSec.sprout) {
      s.growthSec -= P.stageSec.sprout;
      s.stage = 'adult';
      s.form = decideForm(s.cq);
      s.ev.push({ type: 'evolve', form: s.form, cq: s.cq });
      s.cq = P.cqStart; s.cqTimer = 0;
    }
  }

  function settleCQ(s) {
    const avg = (s.needs.hunger + s.needs.mood + s.needs.clean + s.needs.energy) / 4;
    if (avg >= P.cqGoodAt) s.cq += 1;
    else if (avg < P.cqBadBelow) s.cq -= 1;
    if (isUnwell(s)) s.cq -= P.cqSickPenalty;
    s.cq = clamp(s.cq, P.cqMin, P.cqMax);
  }

  function step(s, dt, opts) {
    opts = opts || {};
    const gm = opts.growthMul == null ? 1 : opts.growthMul;
    s.ageSec += dt;
    if (opts.off) opts.off.done += dt;
    if (s.stage === 'egg') { s.growthSec += dt * gm; checkStage(s); return; }

    const hr = dt / 3600;
    const dm = P.stageDecayMul[s.stage];
    const slp = s.sleeping;
    const mul = slp ? P.sleepDecayMul : 1;
    const n = s.needs;
    const prev = { hunger: n.hunger, mood: n.mood, clean: n.clean, energy: n.energy };

    n.hunger -= P.decayPerHour.hunger * dm * mul * hr;
    n.mood -= P.decayPerHour.mood * dm * mul * hr;
    n.clean -= (P.decayPerHour.clean * P.traitCleanDecayMul + s.poops * P.poopCleanPenaltyPerH) * dm * mul * hr;
    if (slp) n.energy += P.sleepRegenPerHour * P.traitSleepRegenMul * hr;
    else n.energy -= P.decayPerHour.energy * dm * hr;
    for (const k of KEYS) n[k] = clamp(n[k], 0, 100);
    if (slp && n.energy >= P.sleepWakeAt) { s.sleeping = false; n.energy = 100; s.ev.push({ type: 'wake' }); }

    s.poopTimer += dt;
    const pi = P.poopIntervalH * 3600;
    while (s.poopTimer >= pi) {
      s.poopTimer -= pi;
      if (s.poops < P.poopMax) s.poops++;
      if (s.poops >= P.poopMax) s.poopTimer = 0;
    }

    if (opts.offline) {
      // 離線保底：最低只降至 20（原本已低過 20 就唔再降）
      for (const k of KEYS) n[k] = Math.max(n[k], Math.min(prev[k], P.offlineNeedFloor));
    }

    if (!isUnwell(s) || opts.offline) s.growthSec += dt * gm;

    if (!opts.offline) {
      s.cqTimer += dt;
      while (s.cqTimer >= 3600) { s.cqTimer -= 3600; settleCQ(s); }
    }
    checkStage(s);
    for (let i = 0; i < stepHooks.length; i++) stepHooks[i](s, dt, opts);
  }

  function advance(s, sec, opts, chunk) {
    chunk = chunk || 30;
    let left = Math.max(0, sec);
    while (left > 1e-9) { const d = Math.min(chunk, left); step(s, d, opts); left -= d; }
  }

  // ── 離線結算 ──
  function fmtDur(Tsec) {
    const h = Tsec / 3600;
    if (h < 1) return Math.max(1, Math.round(Tsec / 60)) + ' 分鐘';
    if (h < 48) return (Math.round(h * 10) / 10) + ' 個鐘';
    return Math.round(h / 24) + ' 日';
  }
  function hourOf(ms) { const d = new Date(ms); return d.getHours() + d.getMinutes() / 60; }
  // lastSaveTime（UTC ms）> now+24h → 無效（時鐘曾被撥前又改返）：重設為 now，lastSeen 一併設為 now → 該段唔派離線獎
  function sanitizeSaveTime(s, nowMs) {
    const A = D.PARAMS.events.lastSaveMaxAheadH * 3600e3;
    if (s.lastSaveTime && nowMs != null && s.lastSaveTime > nowMs + A) { s.lastSaveTime = nowMs; s.lastSeen = nowMs; s.saveTimeResets = (s.saveTimeResets || 0) + 1; s.saveResetAt = nowMs; return true; }   // saveResetAt：當日跳過保底（events）
    return false;
  }
  const offlineHooks = [];
  function addOfflineHook(fn) { offlineHooks.push(fn); }       // events.js 掛：離線事件按「日」補抽（info: {from, now, T, tampered}）
  function applyOffline(s, nowMs) {
    const reset = sanitizeSaveTime(s, nowMs);
    const T = Math.max(0, (nowMs - s.lastSeen) / 1000);
    const E = effectiveOffline(T);
    const before = { needs: Object.assign({}, s.needs), stage: s.stage, sleeping: s.sleeping, poops: s.poops };
    if (s.evs) { s.evs.offLog = []; s.evs.offPop = 0; }
    if (E > 0) {
      const off = { now: nowMs, hour0: hourOf(s.lastSeen), T: Math.min(T, P.offlineCapH * 3600), E, done: 0 };
      advance(s, E, { offline: true, growthMul: P.offlineGrowthRatio, off }, 60);
    }
    for (let i = 0; i < offlineHooks.length; i++) offlineHooks[i](s, { from: s.lastSeen, now: nowMs, T, E, tampered: reset, before });
    s.lastSeen = reset ? nowMs : Math.max(+s.lastSeen || 0, nowMs);   // P1：回撥時鐘唔可以將 lastSeen 拉後（重設除外）
    const rep = { T, E, tampered: reset, show: T >= P.offlineMinAwaySec, summary: [], gift: 0, giftTotal: 0, eventGrains: 0, events: [], stageChanged: s.stage !== before.stage, withdrawn: false };
    if (s.stage !== 'egg' && E > 0) {
      for (const k of KEYS) if (s.needs[k] <= P.offlineNeedFloor + 0.5 && before.needs[k] > P.offlineNeedFloor) { rep.withdrawn = true; }
      if (rep.withdrawn) s.withdrawn = { on: true, fed: false, played: false };
    }
    const evLog = (s.evs && s.evs.offLog) || [];
    rep.events = evLog.map(e => ({ id: e.id, grains: e.grains, mood: e.mood, off: e.off, diary: !!e.diary }));
    rep.eventGrains = evLog.reduce((a, e) => a + (e.diary ? 0 : e.grains), 0);      // 日記內嘅獎勵要玩家領，唔計入
    rep.diaryNew = evLog.filter(e => e.diary).length;
    rep.diaryTotal = (s.evs && s.evs.diary) ? s.evs.diary.length : 0;
    rep.popups = evLog.length - rep.diaryNew;
    if (rep.show) {
      rep.gift = clamp(Math.floor(T / 3600 * P.offlineGiftPerH), 1, P.offlineGiftMax);
      s.grains += rep.gift;
      rep.giftTotal = rep.gift + rep.eventGrains;
      const who = s.stage === 'egg' ? '光卵' : '團絨';
      const lines = [];
      lines.push('你離開咗 ' + fmtDur(T) + '，' + who + '乖乖等你返嚟。');
      let statusTxt = '';
      if (s.stage === 'egg') statusTxt = '光卵靜靜咁發住微光，又暖咗一啲';
      else if (rep.withdrawn) statusTxt = '佢有啲睏倦退縮，餵食同玩耍各一次就會恢復精神';
      else {
        const lk = lowestNeed(s);
        const t = { hunger: '肚仔開始有啲餓', mood: '自己玩玩下有啲悶', clean: '身上沾咗啲塵同絨毛', energy: '有啲眼瞓' }[lk];
        const extra = s.poops > before.poops ? '，仲留低咗 ' + (s.poops - before.poops) + ' 個便便' : '';
        statusTxt = s.needs[lk] >= 60 ? '佢自己過得好開心，仲好精神' + extra : '佢' + t + extra;
      }
      if (rep.events.length && s.stage !== 'egg') {
        // 有事件：第 2 句講事件；狀態併入第 3 句（總數永遠 ≤3 句，無任何懲罰性描述）
        const names = rep.events.filter(e => !e.diary).concat(rep.events.filter(e => e.diary)).slice(0, P.events.offlineSummaryNames).map(e => e.off);
        const more = rep.events.length > names.length ? '，仲有另外 ' + (rep.events.length - names.length) + ' 件小事' : '';
        lines.push('你唔喺度嘅時候，佢' + names.join('、') + more + '。');
        lines.push('佢送咗 ' + rep.giftTotal + ' 粒光粒俾你（' + statusTxt + '）' + (rep.diaryNew ? '，日記入面仲有 ' + rep.diaryNew + ' 件事等你領獎。' : '。'));
      } else {
        lines.push(statusTxt + '。');
        lines.push('佢送咗 ' + rep.gift + ' 粒光粒俾你，記得陪佢玩下接星屑。');
      }
      rep.summary = lines;
    }
    return rep;
  }

  // ── 行動 ──
  function noteFed(s) { if (s.withdrawn.on) { s.withdrawn.fed = true; if (s.withdrawn.played) s.withdrawn.on = false; } }
  function notePlayed(s) { if (s.withdrawn.on) { s.withdrawn.played = true; if (s.withdrawn.fed) s.withdrawn.on = false; } }

  function feed(s, foodId) {
    if (s.stage === 'egg') return { ok: false, reason: 'egg' };
    if (s.sleeping) return { ok: false, reason: 'sleeping' };
    if (s.needs.hunger >= P.feedRefuseAt) return { ok: false, reason: 'full' };
    const f = D.FOODS.find(x => x.id === foodId) || D.FOODS[0];
    let hunger = f.kind === 'snack' ? P.feedSnack : f.kind === 'meal' ? P.feedMeal : P.feedSoup;
    s.needs.hunger = clamp(s.needs.hunger + hunger, 0, 100);
    if (f.kind !== 'snack') s.needs.mood = clamp(s.needs.mood + P.foodMoodBonusWarm, 0, 100);
    s.stats.feeds++; noteFed(s);
    s.ev.push({ type: 'fed', food: f.id });
    return { ok: true, food: f };
  }
  function play(s) {
    if (s.stage === 'egg') return { ok: false, reason: 'egg' };
    if (s.sleeping) return { ok: false, reason: 'sleeping' };
    s.needs.mood = clamp(s.needs.mood + P.playTease, 0, 100);
    s.needs.energy = clamp(s.needs.energy - P.playEnergyCost, 0, 100);
    s.stats.plays++; notePlayed(s);
    s.ev.push({ type: 'played' });
    return { ok: true };
  }
  function rinse(s) {
    if (s.stage === 'egg') return { ok: false, reason: 'egg' };
    if (s.sleeping) return { ok: false, reason: 'sleeping' };
    s.needs.clean = clamp(s.needs.clean + P.rinse, 0, 100);
    s.stats.rinses++;
    s.ev.push({ type: 'rinsed' });
    return { ok: true };
  }
  function clearPoop(s) {
    if (s.poops <= 0) return { ok: false };
    s.poops--; s.stats.poopsCleared++;
    s.ev.push({ type: 'poopCleared' });
    return { ok: true };
  }
  function toggleSleep(s) {
    if (s.stage === 'egg') return { ok: false, reason: 'egg' };
    if (s.sleeping) { s.sleeping = false; return { ok: true, sleeping: false }; }
    if (s.needs.energy >= P.sleepMinEnergyToSleep) return { ok: false, reason: 'notSleepy' };
    s.sleeping = true; return { ok: true, sleeping: true };
  }
  function tapEgg(s) {
    if (s.stage !== 'egg') return { ok: false };
    s.growthSec += P.eggTapBoostSec; s.ev.push({ type: 'eggTap' });
    checkStage(s);
    return { ok: true, progress: eggProgress(s) };
  }
  function eggProgress(s) { return s.stage === 'egg' ? clamp(s.growthSec / P.stageSec.egg, 0, 1) : 1; }
  function stageProgress(s) {
    if (s.stage === 'egg') return eggProgress(s);
    if (s.stage === 'sprout') return clamp(s.growthSec / P.stageSec.sprout, 0, 1);
    return 1;
  }

  // ── 本機日期 key ──
  function dayKey(ms) {
    const d = new Date(ms);
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  // ── 迷你遊戲：接星屑 ──
  class Minigame {
    constructor(seed) {
      const M = P.mg;
      this.M = M; this.rng = makeRng(seed || 12345);
      this.t = 0; this.score = 0; this.over = false;
      this.items = []; this.fx = []; this.snd = [];   // snd：音訊事件佇列（catch／big／stone），UI 每幀清空
      this.basketX = M.fieldW / 2; this.spawnT = 0.6;
      this.caught = 0; this.stones = 0; this.stun = 0;
    }
    update(dt, targetX) {
      if (this.over) return;
      const M = this.M;
      this.t += dt;
      if (this.stun > 0) this.stun -= dt;
      // 籃子跟手（速度上限，stun 時變慢）
      const max = (this.stun > 0 ? 160 : 620) * dt;
      const tx = clamp(targetX == null ? this.basketX : targetX, M.basketW / 2, M.fieldW - M.basketW / 2);
      this.basketX += clamp(tx - this.basketX, -max, max);
      // 生成
      this.spawnT -= dt;
      const prog = clamp(this.t / M.durationSec, 0, 1);
      while (this.spawnT <= 0) {
        const r = this.rng();
        const type = r < M.stoneProb ? 'stone' : r < M.stoneProb + M.bigStarProb ? 'big' : 'star';
        const sp = M.fallSpeed[0] + (M.fallSpeed[1] - M.fallSpeed[0]) * (prog * 0.7 + this.rng() * 0.3);
        this.items.push({ type, x: 10 + this.rng() * (M.fieldW - 20), y: M.spawnTop, vy: sp, r: type === 'big' ? 6 : 5, rot: this.rng() * 6 });
        this.spawnT += M.spawnEvery[0] + (M.spawnEvery[1] - M.spawnEvery[0]) * prog;
      }
      for (const it of this.items) {
        it.y += it.vy * dt; it.rot += dt * 3;
        if (!it.dead && it.y >= M.basketY - 6 && it.y <= M.basketY + 8 && Math.abs(it.x - this.basketX) <= M.basketW / 2 + it.r - 2) {
          it.dead = true;
          if (it.type === 'stone') { this.score = Math.max(0, this.score - M.stonePenalty); this.stones++; this.stun = 0.7; this.fx.push({ type: 'stone', x: it.x, y: it.y }); this.snd.push('stone'); }
          else { this.score += it.type === 'big' ? M.bigStarScore : M.starScore; this.caught++; this.fx.push({ type: it.type, x: it.x, y: it.y }); this.snd.push(it.type === 'big' ? 'big' : 'catch'); }
        } else if (it.y > M.basketY + 40) it.dead = true;
      }
      this.items = this.items.filter(i => !i.dead);
      if (this.t >= M.durationSec) { this.over = true; this.t = M.durationSec; }
    }
  }

  // 結算獎勵（每日首 5 次全額，之後 50%）
  function mgReward(s, score, nowMs) {
    const M = P.mg;
    const dk = dayKey(nowMs);
    if (s.mg.day !== dk) { s.mg.day = dk; s.mg.plays = 0; }
    const full = s.mg.plays < M.dailyFull;
    const ratio = full ? 1 : M.afterRatio;
    const baseGrains = Math.min(M.grainsCap, Math.floor(score / M.grainsDivisor));
    const baseMood = score >= M.highScore ? M.moodHigh : score >= M.passScore ? M.moodPass : M.moodFail;
    return { score, ratio, full, playIndex: s.mg.plays + 1, grains: Math.floor(baseGrains * ratio), mood: Math.round(baseMood * ratio), baseGrains, baseMood };
  }
  function mgApply(s, score, nowMs) {
    const r = mgReward(s, score, nowMs);
    s.mg.plays++; s.mg.best = Math.max(s.mg.best || 0, score);
    s.grains += r.grains;
    s.needs.mood = clamp(s.needs.mood + r.mood, 0, 100);
    s.stats.mgPlays++; notePlayed(s);
    return r;
  }

  // ── 存檔 ──
  function serialize(s) { const c = Object.assign({}, s); delete c.ev; return JSON.stringify(c); }
  function deserialize(str, nowMs) {
    try {
      const o = JSON.parse(str);
      if (!o || o.v !== 1 || !o.needs) return null;
      const base = newState(nowMs, o.seed);
      const s = Object.assign(base, o);
      s.needs = Object.assign(base.needs, o.needs);
      for (const k of KEYS) s.needs[k] = clamp(+s.needs[k] || 0, 0, 100);
      s.mg = Object.assign(base.mg, o.mg || {});
      s.settings = Object.assign(base.settings, o.settings || {});
      s.stats = Object.assign(base.stats, o.stats || {});
      s.withdrawn = Object.assign(base.withdrawn, o.withdrawn || {});
      s.evs = o.evs && typeof o.evs === 'object' ? o.evs : null;
      s.ev = [];
      if (!['egg', 'sprout', 'adult'].includes(s.stage)) return null;
      return s;
    } catch (e) { return null; }
  }

  return {
    makeRng, newState, effectiveOffline, isUnwell, lowestNeed, needBand, decideForm,
    step, advance, applyOffline, addStepHook, addOfflineHook, hourOf, fmtDur, feed, play, rinse, clearPoop, toggleSleep, tapEgg,
    eggProgress, stageProgress, dayKey, Minigame, mgReward, mgApply, serialize, deserialize, sanitizeSaveTime, settleCQ,
  };
});

</script>
<script>/* src/lighting.js */
/* 《微光小圃》 lighting.js — 時段光照 hook（DOM-free）。
   早／午／晚／深夜（按本機時間；?debug=1 可覆寫）→ 燈籠色溫／強度、色調疊層、環境暗度、寵物行為權重。
   預留 weather hook：addModifier(name, fn)，fn(light, ctx) 可改寫 light（例如雨天：lanternMul×0.8、grade 偏藍、beh.sunbathe=0）。原創代碼。 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(require('./data.js'));
  else { root.Glimmer = root.Glimmer || {}; root.Glimmer.light = factory(root.Glimmer.data); }
})(typeof self !== 'undefined' ? self : this, function (D) {
  'use strict';
  const L = D.PARAMS.light;
  const ORDER = ['morning', 'noon', 'evening', 'night'];
  const modifiers = [];

  function periodOf(hour) {
    const h = ((hour % 24) + 24) % 24, st = L.periodStarts;
    if (h >= st.night || h < st.morning) return 'night';
    if (h >= st.evening) return 'evening';
    if (h >= st.noon) return 'noon';
    return 'morning';
  }
  function copy(p) {
    return { lantern: p.lantern.slice(), lanternMix: p.lanternMix, lanternMul: p.lanternMul, grade: p.grade.slice(), gradeA: p.gradeA, ambient: p.ambient, sun: p.sun, beh: Object.assign({}, p.beh) };
  }
  /* ctx 預留：{ weather: 'clear'|'rain'|…, … }（天氣模組日後經 modifier 讀取） */
  function compute(hour, ctx) {
    ctx = ctx || {};
    const id = periodOf(hour), p = L.periods[id];
    const out = Object.assign({ period: id, name: p.name, hour: ((hour % 24) + 24) % 24 }, copy(p));
    out.daylight = daylightAt(out.hour, id);
    for (let i = 0; i < modifiers.length; i++) { const r = modifiers[i].fn(out, Object.assign({ hour: out.hour, period: id }, ctx)); if (r && r !== out) Object.assign(out, r); }
    return out;
  }
  /* ── 遊美 daylight.json（art/daylight/）：4 時段色彩參數。遊策時段（早 07／午 11／晚 17／夜 23）決定「邊個時段」，
        daylight.json 嘅 hours 欄只作參考（偏差已入報告）；跨時段用 blendSeconds 淡入（新時段開始後 blendSeconds 內由上一時段 mix 0→1）。 */
  const DL_MAP = { morning: 'early', noon: 'noon', evening: 'dusk', night: 'night' };
  let DL = null;
  function hex(c) { const n = parseInt(String(c).replace('#', ''), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function mixc(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function setDaylight(json) {
    if (!json || !json.periods) { DL = null; return false; }
    const out = { blendSeconds: json.blendSeconds || 1800, size: json.logicalSize || [480, 270], p: {} };
    for (const k in json.periods) {
      const q = json.periods[k];
      out.p[k] = { id: k, zh: q.zh, bg: q.bg, overlay: q.overlay, ambient: hex(q.ambientMultiply), bloom: q.bloom, vignette: q.vignette, lamp: q.lamp ? q.lamp.intensity : 0, lampPos: q.lamp ? q.lamp.pos : null,
        pet: { mul: hex(q.pet.multiply), add: hex(q.pet.add), rim: hex(q.pet.rimColor), shadow: hex(q.pet.shadowColor) }, sky: q.sky ? [hex(q.sky.top), hex(q.sky.bottom)] : null };
    }
    DL = out; return true;
  }
  const PREV = { morning: 'night', noon: 'morning', evening: 'noon', night: 'evening' };
  function daylightAt(hour, period) {
    if (!DL) return null;
    const st = L.periodStarts; let since = ((hour - st[period]) % 24 + 24) % 24;       // 新時段開始後過咗幾多小時
    const mix = Math.max(0, Math.min(1, since * 3600 / DL.blendSeconds));
    const cur = DL.p[DL_MAP[period]], prev = DL.p[DL_MAP[PREV[period]]];
    const m = (a, b) => mixc(a, b, mix), n = (a, b) => a + (b - a) * mix;
    return { id: cur.id, prev: prev.id, mix, bg: cur.bg, bgPrev: prev.bg, overlay: cur.overlay, overlayPrev: prev.overlay,
      ambient: m(prev.ambient, cur.ambient), bloom: n(prev.bloom, cur.bloom), vignette: n(prev.vignette, cur.vignette), lamp: n(prev.lamp, cur.lamp),
      pet: { mul: m(prev.pet.mul, cur.pet.mul), add: m(prev.pet.add, cur.pet.add), rim: m(prev.pet.rim, cur.pet.rim), shadow: cur.pet.shadow } };
  }
  function addModifier(name, fn) { removeModifier(name); modifiers.push({ name, fn }); }
  function removeModifier(name) { const i = modifiers.findIndex(m => m.name === name); if (i >= 0) modifiers.splice(i, 1); }
  function modifierNames() { return modifiers.map(m => m.name); }
  function representativeHour(period) { return L.periodHour[period]; }

  return { ORDER, setDaylight, daylightAt, DL_MAP, hasDaylight: () => !!DL, periodOf, compute, addModifier, removeModifier, modifierNames, representativeHour };
});

<script>/* src/events.js */
/* 《微光小圃》 events.js — 日常事件系統（DOM-free）。
   - 事件池 9 個（data.js EVENTS：7 個一般＋鬧脾氣＋閃光日）；每 2–4 小時「有效時間」抽一次；每個事件有冷卻；每日保底 ≥1（16:00 後或當日首次開 app）；閃光日 3%；系統時間早於 lastSaveTime → 當日唔抽。

        enter(b, 'walk'); break;
      }
      case 'jump': b.hopsLeft = ri(r, P.jumpHops); b.hopT = 0; b.hopDx = (r() < 0.5 ? -1 : 1) * P.hopDx; enter(b, 'jump'); break;
      case 'play': b.dur = rf(r, P.playDur); b.item = { kind: 'ball', x: 0, y: 0 }; enter(b, 'play'); b.clipT = 0; break;
      case 'nap': b.dur = rf(r, P.napDur); enter(b, 'nap', 'fall'); b.clipT = 0; break;
      case 'sunbathe': b.tx = P.sunSpotX; b.speed = P.walkSpeed * (1 - pm.timidSpeed * pe.timid); b.dur = rf(r, P.sunDur); enter(b, 'sunbathe', 'go'); break;
      case 'bump': {
        const fk = b.fkey === 'dust' ? 'soft' : b.fkey;
        b.tx = P.potX + D.FORMS[fk].pot[0]; b.speed = P.walkSpeed * (1 - pm.timidSpeed * pe.timid); enter(b, 'bump', 'go'); break;
      }
      default: enter(b, 'stay'); b.nextDecide = rf(r, P.decideEvery);
    }
  }
  function backToStay(b) { b.item = null; b.lift = 0; enter(b, 'stay'); b.nextDecide = rf(b.rng, P.decideEvery); if (b.variant) endVariant(b); }
  function goWake(b, after) { b.item = null; b.afterWake = after || null; enter(b, 'wake'); b.clipT = 0; if (b.variant) endVariant(b); }
  function goReact(b) { enter(b, 'react'); b.dur = clipDur('emo_happy'); b.clipT = 0; }
  function goStartle(b, tapX) {
    enter(b, 'startle'); b.dur = P.tap.startleDur; b.clipT = 0; b.awaySign = tapX == null ? 0 : (b.x >= tapX ? 1 : -1); fx(b, 'spark', 0, -50);
  }

  function spawnProps(b) {
    const n = ri(b.rng, P.bumpProps);
    for (let i = 0; i < n; i++) {
      const kind = D.PROP_KINDS[Math.floor(b.rng() * D.PROP_KINDS.length)];
      b.props.push({ kind, x: P.potX + (b.rng() - 0.5) * 8, y: -14, vx: (b.rng() - 0.3) * 34, vy: -(26 + b.rng() * 22), gy: Math.floor(b.rng() * 9), age: 0, life: rf(b.rng, P.propLife), landed: false });
    }
    while (b.props.length > P.propsMax) b.props.shift();
    b.potWobble = 1;
  }
  function stepProps(b) {
    let dead = false;
    for (const p of b.props) {
      p.age += FIX; if (p.age >= p.life) dead = true;
      if (!p.landed) { p.x += p.vx * FIX; p.y += p.vy * FIX; p.vy += 140 * FIX; if (p.y >= p.gy && p.vy > 0) { p.y = p.gy; p.landed = true; p.vx = 0; } }
    }
    if (dead) b.props = b.props.filter(p => p.age < p.life);
  }

  // ── 觸摸 ──
  function tap(b, kind, x, y) { b.taps.push({ kind, x: x || 0, y: y == null ? null : y }); if (b.taps.length > 12) b.taps.shift(); }
  // D2：望向觸點；turn＝true 時觸點喺背後就轉身（有 turn_back clip 由渲染層播，冇就即刻翻轉）
  function lookAtTap(b, tp, turn) {
    const L = b.look; L.tapX = tp.x; L.tapY = tp.y; L.tapUntil = b.t + LK.tapLookSec; L.snap = true;
    if (!turn) return;
    const dx = tp.x - b.x;
    if (Math.abs(dx) > LK.turnMinDx && Math.sign(dx) !== b.dir) {
      const tb = CL.turn_back && CL.turn_back.ready;      // 有 turn_back 美術：播完先回原 clip（顯示層覆蓋，唔改狀態機）
      b.dir = Math.sign(dx); b.turn = { t0: b.t, until: b.t + (tb ? clipDur('turn_back') : LK.turnSec), to: b.dir, clip: tb ? 'turn_back' : null };
      if (tb) note(b, 'clip', 'turn_back');
      note(b, 'turn', b.dir > 0 ? 'R' : 'L'); b.log.enters.turn = (b.log.enters.turn || 0) + 1;
    }
  }
  function processTaps(b, ctx, forced) {
    const T = P.tap;
    while (b.taps.length) {
      const tp = b.taps.shift();
      if (tp.kind === 'wake') {                    // 睡眠中點寵物＝輕喚醒（sim 已關燈起身）：睏睏表情 sleepyHold 秒，唔鬧脾氣、唔扣需求
        b.petTaps.length = 0; b.holdUntil = b.t + T.sleepyHold; note(b, 'tap', 'lightWake'); b.log.enters.lightWake = (b.log.enters.lightWake || 0) + 1;
        if (b.state !== 'wake' && b.state !== 'simsleep') goWake(b, null);
        continue;
      }
      if (forced && ctx.s.sleeping && tp.kind === 'pet') { b.petTaps.length = 0; b.stir = b.t + 1.2; note(b, 'tap', 'sleepStir'); b.log.enters.sleepStir = (b.log.enters.sleepStir || 0) + 1; continue; }   // 睡眠中連點：唔鬧脾氣，只係翻身（zzz 加快）
      if (!forced && tp.kind === 'pet' && (b.state === 'startle' || b.state === 'play')) {      // 不可中斷動作期間嘅連點：照計，夠數就升級（撒嬌／鬧脾氣）
        b.lastTouch = b.t; b.petTaps.push(b.t); b.petTaps = b.petTaps.filter(t => b.t - t <= Math.max(T.cuddlyWindow, T.rapidWindow));
        const rapid = b.petTaps.length, quick = b.petTaps.filter(t => b.t - t <= T.cuddlyWindow).length; note(b, 'tap', 'pet', String(rapid));
        if (rapid >= T.rapidCount && b.t >= b.grumpyCool) { b.petTaps.length = 0; b.dur = T.grumpyDur; b.steamT = 0; b.item = null; enter(b, 'grumpy'); b.grumpyCool = b.t + T.grumpyDur + T.grumpyCooldown; b.tantrumReq = (b.tantrumReq || 0) + 1; note(b, 'tap', 'tantrum'); continue; }
        if (quick >= T.cuddlyCount && b.state === 'startle') { b.cuddlyUntil = b.t + 0.8; enter(b, 'cuddly'); b.clipT = 0; continue; }
      }
      const asleep = (forced && ctx.s.sleeping) || b.state === 'nap';
      if ((tp.kind === 'pet' || tp.kind === 'ground') && !asleep) lookAtTap(b, tp, tp.kind === 'pet' && !forced && !NONINT[b.state] && b.state !== 'cuddly');
      if (forced || NONINT[b.state] || (b.state === 'nap' && b.phase === 'fall')) { b.log.enters.tapIgnored = (b.log.enters.tapIgnored || 0) + 1; continue; }
      if (tp.kind === 'pet') {
        const gap = b.t - b.lastTouch; b.lastTouch = b.t;
        if (b.state === 'nap') { b.petTaps.length = 0; note(b, 'tap', 'sleepWake'); b.holdUntil = b.t + T.sleepyHold; goWake(b, null); continue; }   // 小睡中被點／連點：輕喚醒（睏睏表情），唔鬧脾氣
        b.petTaps.push(b.t); b.petTaps = b.petTaps.filter(t => b.t - t <= Math.max(T.cuddlyWindow, T.rapidWindow));
        const rapid = b.petTaps.length, quick = b.petTaps.filter(t => b.t - t <= T.cuddlyWindow).length;
        note(b, 'tap', 'pet', String(rapid));
        if (b.state === 'nap') { goWake(b, 'startle'); continue; }           // 睡中被點：wake → emo_surprised
        if (rapid >= T.rapidCount && b.t >= b.grumpyCool) {
          b.petTaps.length = 0; b.dur = T.grumpyDur; b.steamT = 0; enter(b, 'grumpy'); b.grumpyCool = b.t + T.grumpyDur + T.grumpyCooldown; b.tantrumReq = (b.tantrumReq || 0) + 1; note(b, 'tap', 'tantrum'); if (b.variant) endVariant(b);
        } else if (quick >= T.cuddlyCount) {
          b.cuddlyUntil = b.t + 0.8;
          if (b.state !== 'cuddly') { enter(b, 'cuddly'); b.clipT = 0; if (b.variant) endVariant(b); }
        } else if (b.state === 'cuddly') b.cuddlyUntil = b.t + 0.8;
        else if (gap > T.idleSurpriseSec) { goStartle(b, tp.x); if (b.variant) endVariant(b); }
        else { goReact(b); fx(b, 'spark', 0, -50); if (b.variant) endVariant(b); }
      } else if (tp.kind === 'ground') {
        b.lastTouch = b.t; note(b, 'tap', 'ground');
        const p = clamp(T.followBase + P.persMul.stickyFollow * b.pers.sticky - P.persMul.timidFollowPenalty * b.pers.timid, 0, 1);
        b.dir = tp.x >= b.x ? 1 : -1;
        if (b.state === 'nap') { goWake(b, null); continue; }
        if (b.rng() < p) { b.tx = tp.x; b.speed = P.followSpeed; enter(b, 'follow'); if (b.variant) endVariant(b); }
        else if (b.state === 'stay' && !b.variant && b.base === 'idle') { b.variant = 'blink'; b.variantT = 0; b.clipT = 0; b.clip = 'blink'; b.log.variants.push({ name: 'blink', start: b.t, end: null }); }
      }
    }
  }

  // ── 單一固定步 ──
  function step(b, ctx) {
    b.t += FIX; b.stateT += FIX; b.clipT += FIX; b.log.ticks++;
    const s = ctx.s;
    b.stage = s.stage === 'adult' ? 'adult' : 'sprout'; b.fkey = formKey(s);
    b.expr = exprFor(s); if (b.t < b.holdUntil && b.expr !== 'sick') b.expr = 'tired'; b.base = D.EXPRESSIONS[b.expr].clip;
    b.lift = 0; b.gaze = 0;
    b.potWobble = Math.max(0, b.potWobble - P.potWobbleDecay * FIX);
    stepProps(b);
    if (s.stage === 'egg') { b.taps.length = 0; setClip(b, 'idle'); b.frame = 0; b.attach = NOATT; return; }
    const unwell = b.expr === 'unwell';
    if (b.state === 'simsleep' && !s.sleeping && !ctx.override) { enter(b, 'wake'); b.afterWake = null; b.clipT = 0; }
    const forcedKind = ctx.override ? 'override' : s.sleeping ? 'simsleep' : unwell ? 'unwell' : ctx.event ? 'event' : null;
    const hold = forcedKind && forcedKind !== 'override' && b.state === 'wake';     // wake 不可中斷
    processTaps(b, ctx, !!forcedKind);
    b.log.time[b.state] = (b.log.time[b.state] || 0) + FIX;
    if (forcedKind && !hold) forcedStep(b, ctx, forcedKind);
    else {
      if (b.state === 'override' || b.state === 'simsleep' || b.state === 'unwell' || b.state === 'event') {
        const eat = b.state === 'override' && b.lastOverride === 'eat';
        b.item = null; b.lift = 0; if (eat) goReact(b); else backToStay(b);   // eat → emo_happy（art next）
      }
      autoStep(b, ctx);
    }
    b.frame = frameOf(b.clip, b.clipT);
    b.attach = attachOf(b);
    if (b.turn && b.t >= b.turn.until) b.turn = null;
    const tc = b.turn && b.turn.clip && !s.sleeping ? b.turn.clip : null;
    b.show.clip = tc || b.clip; b.show.frame = tc ? Math.min(CL[tc].frames - 1, Math.floor((b.t - b.turn.t0) * CL[tc].fps + 1e-6)) : b.frame;
    stepLook(b, ctx); b.face = faceFor(b);
  }
  function attachOf(b) {
    const a = CL[b.clip].attach; if (!a) return NOATT;
    let all = true; for (const x of a) if (b.frame < x.from) { all = false; break; }
    return all ? a : a.filter(x => b.frame >= x.from);
  }

  function forcedStep(b, ctx, kind) {
    const s = ctx.s;
    if (b.state !== kind) { enter(b, kind, kind === 'event' ? '' : 'go'); b.item = null; if (b.variant) endVariant(b); }
    if (kind === 'override') {
      const nm = CL[ctx.override] ? ctx.override : 'emo_happy'; b.lastOverride = nm;
      const hop = nm === 'celebrate' || ctx.override === 'happy';
      const arrived = moveTo(b, 0, P.retreatSpeed); setClip(b, nm);
      if (hop && arrived) { b.hopT += FIX; if (b.hopT >= P.hopDur) b.hopT = 0; hopLift(b, H_OF(b) * 0.5, P.hopDur); }
      return;
    }
    if (kind === 'simsleep' || kind === 'unwell') {
      if (b.phase === 'go') { const arrived = moveTo(b, 0, P.walkSpeed * 1.3); setClip(b, 'walk'); if (arrived) { setPhase(b, kind === 'simsleep' ? 'fall' : 'sick'); b.clipT = 0; } return; }
      if (b.phase === 'fall') { setClip(b, 'fall_asleep'); if (b.stateT >= clipDur('fall_asleep')) setPhase(b, 'loop'); return; }
      if (b.phase === 'loop') { setClip(b, 'sleep_loop'); return; }
      setClip(b, 'sick'); return;
    }
    // event 腳本
    const ev = ctx.event, v = ev.vis || {}, id = ev.id;
    if (b.evId !== id) { b.evId = id; note(b, 'event', id); }      // 日誌：事件開始（__qa.pet.log 可見 firefly_walk 等）
    if (id === 'butterfly') {
      const dx = v.rx - b.x; b.gaze = Math.sign(dx);
      if (Math.abs(dx) > 14) { moveTo(b, v.rx, P.followSpeed); setClip(b, 'walk'); }
      else { b.hopT += FIX; const u = hopLift(b, H_OF(b) * 0.7, P.hopDur); setClip(b, 'jump'); b.clipT = u * clipDur('jump'); if (b.hopT >= P.hopDur) b.hopT = 0; }
    } else if (id === 'firefly_walk') {
      const dx = v.rx - b.x; b.gaze = Math.sign(dx) || b.gaze;
      if (Math.abs(dx) > 8) { moveTo(b, v.rx, P.walkSpeed * 1.4); setClip(b, 'walk'); }
      else { b.hopT += FIX; if (b.hopT >= P.hopDur) b.hopT = 0; hopLift(b, H_OF(b) * 0.4, P.hopDur); loopClip(b, 'play'); }   // play＝現有玩耍 clip（待定→placeholder）
    } else if (id === 'meteor') setClip(b, 'lookup');
    else if (id === 'rainbow') { b.hopT += FIX; if (b.hopT >= P.hopDur) b.hopT = 0; hopLift(b, H_OF(b) * 0.5, P.hopDur); loopClip(b, 'emo_happy'); }
    else if (id === 'flash') { b.hopT += FIX; if (b.hopT >= P.hopDur) b.hopT = 0; hopLift(b, H_OF(b) * 0.5, P.hopDur); loopClip(b, 'celebrate'); if (b.hopT < FIX) fx(b, 'spark', (b.rng() - 0.5) * 30, -50); }
    else if (id === 'gift') {
      if (ev.t < 0.7) { moveTo(b, -10, P.followSpeed); setClip(b, 'walk'); }
      else { b.hopT += FIX; if (b.hopT >= P.hopDur) b.hopT = 0; hopLift(b, H_OF(b) * 0.6, P.hopDur); loopClip(b, 'cheer_jump'); }
    } else if (id === 'treasure') {
      if (!v.found) { const a = moveTo(b, v.digX, P.walkSpeed * 1.6); setClip(b, a ? 'dig' : 'walk'); if (a) loopClip(b, 'dig'); }
      else { b.hopT += FIX; if (b.hopT >= P.hopDur) b.hopT = 0; hopLift(b, H_OF(b) * 0.6, P.hopDur); loopClip(b, 'cheer_jump'); }
    } else if (id === 'grumpy') {
      b.steamT += FIX; if (b.steamT >= 0.45) { b.steamT = 0; fx(b, 'steam', (b.rng() - 0.5) * 18, -40); } loopClip(b, 'grumpy'); b.x += Math.sin(b.t * 50) * 0.15;
    } else if (id === 'sleeptalk') {
      if (b.phase === 'go' || b.phase === '') { const a = moveTo(b, 0, P.walkSpeed * 1.3); setClip(b, 'walk'); if (a) { setPhase(b, 'fall'); b.clipT = 0; } }
      else if (b.phase === 'fall') { setClip(b, 'fall_asleep'); if (b.stateT >= clipDur('fall_asleep')) setPhase(b, 'loop'); }
      else loopClip(b, 'sleep_loop');
    } else setClip(b, 'idle');
  }

  function autoStep(b, ctx) {
    const r = b.rng, s = ctx.s;
    switch (b.state) {
      case 'stay': {
        const idleBase = b.base === 'idle';
        setClip(b, b.variant || b.base);
        if (b.clip === b.base && b.base !== 'idle') loopClip(b, b.base);
        if (b.variant) { b.variantT += FIX; if (b.variantT >= clipDur(b.variant)) endVariant(b); }
        else {
          if (idleBase) {
            b.nextVariant -= FIX;
            if (b.nextVariant <= 0) { startVariant(b, s); break; }
          }
          if (b.expr === 'tired' && b.stateT >= 10) { startState(b, 'nap', ctx); break; }   // 精力<30 且閒置>10s 必定入睡（art weightMods）
          b.nextDecide -= FIX;
          if (b.nextDecide <= 0) { const n = pickW(r, weights(b, ctx)); if (n === 'stay') b.nextDecide = rf(r, P.decideEvery); else startState(b, n, ctx); }
        }
        break;
      }
      case 'walk': case 'follow': {
        loopClip(b, 'walk'); b.gaze = b.dir;
        if (moveTo(b, b.tx, b.speed)) { if (b.state === 'follow') goReact(b); else backToStay(b); }
        break;
      }
      case 'jump': {
        b.hopT += FIX; const u = hopLift(b, H_OF(b), P.hopDur); setClip(b, 'jump'); b.clipT = u * clipDur('jump');
        b.x = clamp(b.x + b.hopDx * FIX / P.hopDur, P.rangeX[0], P.rangeX[1]);
        if (b.hopT >= P.hopDur) { b.hopT = 0; b.hopsLeft--; b.lift = 0; if (b.hopsLeft <= 0) backToStay(b); }
        break;
      }
      case 'play': {
        loopClip(b, 'play'); const u = b.stateT;
        b.item.x = b.dir * 16 + Math.sin(u * 2.4) * 10; b.item.y = -Math.abs(Math.sin(u * 4.8)) * 22;
        b.gaze = b.dir;
        if (b.stateT >= b.dur) { b.cool.play = b.t + CL.play.cooldown; backToStay(b); }
        break;
      }
      case 'nap': {
        if (b.phase === 'fall') { setClip(b, 'fall_asleep'); if (b.stateT >= clipDur('fall_asleep')) setPhase(b, 'loop'); }
        else { loopClip(b, 'sleep_loop'); if (b.stateT >= b.dur) goWake(b, null); }
        break;
      }
      case 'wake': {
        setClip(b, 'wake');
        if (b.stateT >= clipDur('wake')) { const a = b.afterWake; b.afterWake = null; if (a === 'startle') goStartle(b, null); else backToStay(b); }
        break;
      }
      case 'sunbathe': {
        if (b.phase === 'go') { const a = moveTo(b, b.tx, b.speed); loopClip(b, 'walk'); b.gaze = b.dir; if (a) { setPhase(b, 'lie'); b.cool.sunbathe = b.t + P.envCooldown; } }
        else {
          loopClip(b, 'sunbathe');
          if (ctx.sun != null && ctx.sun < P.sunMinLight * 0.5) b.stateT = b.dur;  // 日落就起身
          if (b.stateT >= b.dur) backToStay(b);
        }
        break;
      }
      case 'bump': {
        if (b.phase === 'go') { const a = moveTo(b, b.tx, b.speed); loopClip(b, 'walk'); b.gaze = b.dir; if (a) { setPhase(b, 'hit'); b.clip = 'pot_bump'; b.clipT = 0; note(b, 'clip', 'pot_bump'); b.dir = -1; b.cool.bump = b.t + P.envCooldown; } }
        else {
          setClip(b, 'pot_bump');
          if (!b.hitDone && b.clipT >= P.bumpImpactFrame / CL.pot_bump.fps) { b.hitDone = true; note(b, 'impact', 'pot_bump'); spawnProps(b); fx(b, 'dust', P.potX + 8, -4); }
          if (b.clipT >= clipDur('pot_bump')) { b.hitDone = false; backToStay(b); }
        }
        break;
      }
      case 'grumpy': {
        loopClip(b, 'grumpy'); b.steamT += FIX; b.x += Math.sin(b.t * 50) * 0.15;
        if (b.steamT >= 0.4) { b.steamT = 0; fx(b, 'steam', (r() - 0.5) * 18, -40); }
        if (b.stateT >= b.dur) backToStay(b);
        break;
      }
      case 'react': { setClip(b, 'emo_happy'); if (b.stateT >= b.dur) backToStay(b); break; }
      case 'cuddly': { loopClip(b, 'emo_cuddly'); if (b.t >= b.cuddlyUntil && b.stateT >= P.tap.cuddlyMin) backToStay(b); break; }
      case 'startle': {
        setClip(b, 'emo_surprised');
        if (b.stateT >= b.dur) {
          if (b.awaySign && b.pers.timid >= 0.5 && r() < P.tap.timidAwayChance) {     // 膽小：60% 走開
            b.tx = clamp(b.x + b.awaySign * rf(r, P.walkDist), P.rangeX[0], P.rangeX[1]); b.speed = P.followSpeed * 0.7; enter(b, 'walk');
          } else backToStay(b);
        }
        break;
      }
      default: backToStay(b);
    }
  }

  // ── F2 視線：揀目標 → 平滑 → 量化（L/CL/C/CR/R/U/D）──
  const MIRROR = { L: 'R', CL: 'CR', C: 'C', CR: 'CL', R: 'L', U: 'U', D: 'D' };
  function quantGaze(gx, gy) {
    const q = LK.quant;
    if (gy <= -q.v && -gy >= Math.abs(gx)) return 'U';
    if (gy >= q.v && gy >= Math.abs(gx)) return 'D';
    if (gx <= -q.side) return 'L'; if (gx < -q.center) return 'CL';
    if (gx >= q.side) return 'R'; if (gx > q.center) return 'CR';
    return 'C';
  }
  const SLEEPCLIP = { sleep_loop: 1, fall_asleep: 1 };
  function lookTarget(b, ctx) {
    const L = b.look, r = b.lrng, t = b.t, headY = LK.headY[b.stage === 'adult' ? 'adult' : 'sprout'] + b.lift;
    const pt = (x, y, src) => { L.src = src; return [clamp((x - b.x) / LK.rangeX, -1, 1), clamp((y - headY) / LK.rangeY, -1, 1)]; };
    const cam = () => { L.src = 'camera'; return [0, 0]; };
    if (L.force) { L.src = 'force'; return null; }
    if (SLEEPCLIP[b.clip] || b.state === 'simsleep') { L.src = 'closed'; return [0, 0.2]; }
    if (t < L.tapUntil) return pt(L.tapX, L.tapY == null ? headY : L.tapY, 'tap');

    const chip = sn + '|' + sub + '|' + unwell + '|' + Math.round(SIM.stageProgress(s) * 100) + '|' + s.withdrawn.on;

    else if (sleeping) msg = 'zZz…';

});

<script>/* src/main.js */
/* 《微光小圃》 main.js — 啟動、主迴圈、存檔、離線結算、縮放。原創代碼。 */
(function () {

  // ── 存檔 ──
  function load() {

    if (!s) { s = SIM.newState(G.now()); const coarse = window.matchMedia && matchMedia('(pointer:coarse)').matches; s.settings.quality = qs.get('q') || (G.lowEnd() ? 'low' : coarse ? 'mid' : 'high'); }
    else { if (s.evs) s.evs.active = null; rep = SIM.applyOffline(s, G.now()); }   // 存檔內未完嘅 active 事件唔可續播：丟棄，否則 takePending 永遠被擋住

  G.resetSave = function () { try { localStorage.removeItem(P.saveKey); } catch (e) { } window.__noSaveOnHide = true; location.reload(); };
  G.setQuality = function (q) { G.state.settings.quality = q; G.renderer.blurEvery = 1; G.save(); };
  G.fastForward = function (sec) { SIM.advance(G.state, sec, {}, 30); };
  G.simOffline = function (h) { G.state.lastSeen = G.now() - h * 3600e3; const rep = SIM.applyOffline(G.state, G.now()); G.save(); UI.showSummary(rep); return rep; };

  G.liveLoad = (P.face.liveliness.enabled && qs.get('live') !== '0') ? G.renderer.loadLive(P.face.liveliness).then((lv) => {

  }) : Promise.resolve(null);

  AUD.init(G);

  { const w = EV.diaryWarn(G.state, G.now()); if (w) setTimeout(() => UI.toast('日記有 ' + w + ' 件小事就快過期，記得領'), 1500); }
  if (boot.rep && boot.rep.show) UI.showSummary(boot.rep);

  G.bootReport = boot.rep;

  G.paused = false;

    const s = G.state;

      const dtW = G.paused ? 0 : dtReal;

      saveT += dtReal; if (saveT >= P.autosaveSec) { saveT = 0; G.save(); }

  };

        ev: G.ev ? G.ev.rec.id : null, pending: E ? E.pending.length : 0, diary: E ? E.diary.length : 0, needs: Object.assign({}, G.state.needs), t: +b.t.toFixed(2) };

    tapPet(n) { for (let i = 0; i < (n || 1); i++) { if (G.state.sleeping) G.lightWake(); else BEH.tap(G.beh, 'pet', G.beh.x + G.beh.dir * 5, -20); } },   // 點寵物前面（唔觸發 D2 轉身）

    tap(x, y) { BEH.tap(G.beh, 'pet', x, y == null ? -20 : y); },               // 指定觸點（相對地面中心 CX／GROUND_Y，art px）
    gaze() { const L = G.beh.look; return { q: L.q, ql: L.ql, src: L.src, x: +L.x.toFixed(3), y: +L.y.toFixed(3), tx: +L.tx.toFixed(3), ty: +L.ty.toFixed(3), force: L.force, dir: G.beh.dir, turn: G.beh.turn ? Object.assign({}, G.beh.turn) : null }; },
    face() { const f = G.beh.face, r = G.renderer, l = r.faceStat.last || {}; return { eyes: f.eyes, mouth: f.mouth, gaze: f.gaze, closed: f.closed, clip: f.clip, frame: f.frame, blink: f.blink, mode: P.face.mode, live: !!l.live, liveReady: !!G.liveReady, liveError: r.lvError, drawnClip: l.clip, drawnFrame: l.frame, faceVisible: !!l.faceVisible, pieces: l.eyes ? l.eyes.concat([l.mouth]) : [], placeholder: (l.placeholder || []).slice(), derived: !!l.derived, bulb: l.bulb || null, stat: { draws: r.faceStat.draws, tints: r.faceStat.tints, overlays: r.faceStat.overlays, faceDrawn: r.faceStat.faceDrawn, faceHidden: r.faceStat.faceHidden, placeholder: r.faceStat.placeholder, bulb: r.faceStat.bulb } }; },
    setGaze(q) { G.beh.look.force = q || null; return q; },                    // QA：強制 gaze 格（null＝自動）
    setFace(o) { G.beh.faceForce = o || null; return o; },                     // QA：強制 {eyes, mouth}（null＝自動）
    faceMode(m) { P.face.mode = m || 'auto'; return P.face.mode; },             // auto｜native（舊 atlas 原臉）｜off（唔畫臉）
    faceStatReset() { const fs = G.renderer.faceStat; for (const k in fs) if (typeof fs[k] === 'number') fs[k] = 0; },   // 模擬點寵物（睡眠中＝輕喚醒）
    lightWake() { return G.lightWake(); },
    events() { return G.state.evs; },
    eventLog() { return G.state.evs ? G.state.evs.log : []; },                    // 事件觸發紀錄 [{id,kind,day,date,hour,at,offline,diary}]
    claimedFlashDates() { return G.state.evs ? G.state.evs.claimedFlashDates.slice() : []; },   // 閃光日「已領」旗標（存檔內）
    daylight() { const d = G.light && G.light.daylight; return { ready: !!G.daylightReady, json: !!G.daylightJson, room: !!P.art.daylightBg, blendSeconds: G.daylightJson ? G.daylightJson.blendSeconds : null, dl: d ? { id: d.id, prev: d.prev, mix: +d.mix.toFixed(3), ambient: d.ambient.map(Math.round), bloom: +d.bloom.toFixed(3), vignette: +d.vignette.toFixed(3), petMul: d.pet.mul.map(Math.round) } : null, error: G.daylightError || G.renderer.dlError || null }; },
    lastSaveTime() { return G.state.lastSaveTime || null; },
    suppressed() { return G.state.evs ? EV.suppressed(G.state, G.state.evs) : false; },     // 時間回撥 → 當日唔抽事件／閃光
    flashToday() { const E = G.state.evs; return E ? { flashToday: E.flashToday, flashDone: E.flashDone, date: EV.dateKey(E), claimed: EV.flashClaimed(E) } : null; },
    pool() { return D.EVENTS.map(e => ({ id: e.id, weight: e.weight, hours: e.hours || null, rare: !!e.rare, cooldownH: e.cooldownH || (e.rare ? D.PARAMS.events.cooldownRareH : D.PARAMS.events.cooldownH), special: !!e.special, lowNeed: !!e.lowNeed })); },
    audio() { return AUD.status(); },
    audioLog() { return AUD.log; },
  };
})();
