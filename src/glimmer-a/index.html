<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1030">
<link rel="icon" href="data:,">
<title>微光小圃（原型）</title>
<style>
  :root { --warm:#ffd36a; --warm2:#f59a4a; --ink:#0b1030; --panel:rgba(14,20,52,.78); --line:#f2c27e; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin:0; height:100%; background:#05071a; overflow:hidden; touch-action:none;
    font-family:"Noto Sans CJK HK","Noto Sans HK","PingFang HK","Microsoft JhengHei","Noto Sans CJK TC",sans-serif; color:#fff2d8; }
  #app { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at 50% 40%, #151d4a 0%, #05071a 70%); }
  #stagewrap { position:relative; z-index:1; }
  /* P1-5：按短邊 fit；畫面外用同一畫面嘅低解析模糊放大延伸填滿（唔留黑邊） */
  #bgfill { position:fixed; inset:0; width:100%; height:100%; z-index:0; image-rendering:auto; filter:saturate(.9) brightness(.82); pointer-events:none; }
  /* P1-2：橫向（觸控裝置）顯示「請轉直向」 */
  #rotate { position:fixed; inset:0; z-index:500; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; background:#05071a; color:#fff2d8; font-size:20px; letter-spacing:2px; text-align:center; }
  #rotate .ph { width:44px; height:76px; border:3px solid var(--warm); border-radius:9px; animation:rot 1.8s ease-in-out infinite; }
  @keyframes rot { 0%,30% { transform:rotate(90deg); } 60%,100% { transform:rotate(0deg); } }
  @media (orientation: landscape) and (pointer: coarse) { #rotate { display:flex; } }
  html.force-landscape #rotate { display:flex; }
  #gl { display:block; image-rendering:pixelated; }
  #ui { position:absolute; left:0; top:0; width:390px; height:844px; transform-origin:0 0; overflow:hidden; }
  #hit { position:absolute; inset:0; touch-action:none; }
  .abs { position:absolute; }
  .panel { background:var(--panel); border:2px solid var(--line); border-radius:10px; box-shadow:0 0 0 2px rgba(11,16,48,.8), 0 4px 14px rgba(0,0,0,.4); backdrop-filter:blur(2px); }
  #hud { position:absolute; left:10px; right:10px; top:10px; pointer-events:none; }
  #chip { position:absolute; left:0; top:0; padding:5px 10px 6px; min-width:150px; pointer-events:none; }
  #chip b { font-size:14px; letter-spacing:1px; }
  #chip small { display:block; font-size:11px; opacity:.8; margin-top:1px; }
  #prog { height:5px; background:#0b1030; border-radius:3px; margin-top:4px; overflow:hidden; border:1px solid #6a5a3a; }
  #progf { height:100%; width:0; background:linear-gradient(90deg,#ffd36a,#ffb23a); }
  #top-r { position:absolute; right:0; top:0; display:flex; gap:6px; align-items:center; pointer-events:auto; }
  #grains { padding:6px 10px; font-size:14px; font-weight:700; color:var(--warm); }
  .ibtn { width:44px; height:44px; min-width:44px; min-height:44px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:18px; cursor:pointer; color:var(--warm); }
  #needs { position:absolute; left:0; right:0; top:72px; display:flex; gap:6px; pointer-events:none; }
  .need { flex:1; padding:4px 6px 6px; }
  .need span { font-size:11px; display:block; opacity:.9; margin-bottom:3px; }
  .track { height:9px; background:#0b1030; border-radius:5px; overflow:hidden; border:1px solid #6a5a3a; position:relative; }
  .fill { height:100%; width:50%; background:var(--warm); transition:width .25s; }
  .fill.ok { background:var(--warm2); } .fill.warn { background:#ff6a6a; animation:pulse .9s infinite; }
  @keyframes pulse { 50% { opacity:.45; } }
  #bubble { position:absolute; left:50%; transform:translateX(-50%); padding:6px 12px; font-size:13px; white-space:nowrap; pointer-events:none; display:none;
    background:#fff6dc; color:#4a2e1a; border:2px solid #c0783f; border-radius:12px; }
  #bubble:after { content:""; position:absolute; left:50%; bottom:-9px; margin-left:-6px; border:6px solid transparent; border-top-color:#c0783f; border-bottom:0; }
  #bar { position:absolute; left:10px; right:10px; bottom:14px; display:flex; gap:8px; }
  .abtn { flex:1; height:74px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:13px; cursor:pointer; position:relative; }
  .abtn canvas { width:30px; height:30px; image-rendering:pixelated; }
  .abtn.dis { opacity:.4; }
  .abtn.hint { animation:glow 1.1s infinite; }
  @keyframes glow { 50% { box-shadow:0 0 14px 4px rgba(255,211,106,.8), 0 0 0 2px rgba(11,16,48,.8); } }
  #pop { position:absolute; left:10px; right:10px; bottom:98px; padding:8px; display:none; gap:6px; flex-direction:column; }
  .pitem { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; background:rgba(255,211,106,.12); cursor:pointer; font-size:14px; }
  .pitem:active { background:rgba(255,211,106,.35); }
  .pitem canvas { width:30px; height:30px; image-rendering:pixelated; }
  .pitem small { margin-left:auto; opacity:.75; font-size:11px; }
  #evcard { position:absolute; left:14px; right:14px; top:128px; padding:8px 12px 9px; display:none; pointer-events:none; text-align:center; z-index:12; font-size:13px; line-height:1.5; }
  #evcard #evicon { width:48px; height:48px; image-rendering:pixelated; display:block; margin:0 auto 2px; }
  #evcard b { display:block; color:var(--warm); font-size:15px; letter-spacing:2px; }
  #evcard small { display:block; margin-top:2px; color:var(--warm); font-size:12px; }
  #toast { position:absolute; left:50%; top:150px; transform:translateX(-50%); padding:7px 14px; font-size:13px; display:none; pointer-events:none; white-space:nowrap; }
  #modal { position:absolute; inset:0; background:rgba(5,7,26,.62); display:none; align-items:center; justify-content:center; z-index:20; }
  #mbox { width:322px; padding:18px 18px 14px; text-align:center; }
  #mbox h2 { margin:0 0 10px; font-size:19px; color:var(--warm); letter-spacing:2px; }
  #mbox p { margin:6px 0; font-size:14px; line-height:1.55; }
  .dexGrid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:4px 0; } .dexCell { background:rgba(255,255,255,.06); border-radius:8px; padding:4px 2px 5px; display:flex; flex-direction:column; align-items:center; } .dexCell b { font-size:12px; margin-top:2px; } .dexCell small { font-size:10px; line-height:1.3; opacity:.8; min-height:26px; } .dexImg { width:72px; height:72px; image-rendering:pixelated; }
  .btn { display:inline-block; margin:12px 4px 0; padding:9px 22px; background:linear-gradient(#ffd36a,#f59a4a); color:#4a2410; font-weight:700; border-radius:9px; cursor:pointer; border:2px solid #fff0c0; font-size:15px; }
  .btn.sec { background:#2a3066; color:#ffe9b8; border-color:#6a5a8a; }
  .seg { display:flex; gap:4px; margin:6px 0; } .seg .btn { flex:1; margin:0; padding:7px 0; font-size:13px; }
  .seg .btn:not(.on) { background:#2a3066; color:#ffe9b8; border-color:#4a4a8a; }
  .row { display:flex; justify-content:space-between; align-items:center; margin:12px 0 2px; font-size:14px; text-align:left; }
  #mgHud { position:absolute; left:10px; right:10px; top:10px; display:none; pointer-events:none; }
  #mgHud .panel { display:inline-block; padding:6px 12px; font-size:15px; font-weight:700; }
  #mgQuit { position:absolute; right:0; top:0; pointer-events:auto; padding:6px 12px; font-size:13px; cursor:pointer; }
  #mgTimeBar { position:absolute; left:0; right:0; top:44px; height:8px; }
  #mgMsg { position:absolute; left:0; right:0; top:340px; text-align:center; font-size:34px; font-weight:800; color:#ffe27a; text-shadow:0 2px 0 #7a4a1a; display:none; pointer-events:none; }
  #dbgT { position:absolute; left:4px; top:136px; z-index:16; padding:2px 7px; font-size:10px; display:none; opacity:.7; cursor:pointer; }
  #dbg { position:absolute; left:4px; top:160px; width:196px; padding:6px; font-size:10.5px; z-index:15; display:none; max-height:560px; overflow:auto; }
  #dbg .g { margin-bottom:5px; line-height:1.9; } #dbg b { color:var(--warm); }
  #dbg button { font:inherit; font-size:10.5px; padding:2px 6px; margin:1px; background:#2a3066; color:#ffe9b8; border:1px solid #6a5a8a; border-radius:4px; }
  #dbg button.on { background:var(--warm2); color:#2a1000; }
  #dbg #dinfo { white-space:pre; font-family:monospace; font-size:10px; opacity:.9; }
</style>
</head>
<body>
<div id="app">
  <canvas id="bgfill" width="24" height="52" aria-hidden="true"></canvas>
  <div id="stagewrap">
    <canvas id="gl"></canvas>
    <div id="ui">
      <div id="hit"></div>
      <div id="hud">
        <div id="chip" class="panel"><b id="stagename">光卵</b><small id="substage"></small><div id="prog"><div id="progf"></div></div></div>
        <div id="top-r"><div id="grains" class="panel">✦ 0</div><div id="dex" class="ibtn panel" data-testid="dex" title="圖鑑">🔍</div><div id="diary" class="ibtn panel" data-testid="diary" style="position:relative">📖<i id="diaryN" style="display:none;position:absolute;right:-4px;top:-5px;min-width:15px;height:15px;border-radius:8px;background:#ff6a6a;color:#fff;font:700 10px/15px sans-serif;text-align:center;font-style:normal"></i></div><div id="gear" class="ibtn panel" data-testid="gear">⚙</div></div>
        <div id="needs">
          <div class="need panel" data-need="hunger"><span>飽腹</span><div class="track"><div class="fill"></div></div></div>
          <div class="need panel" data-need="mood"><span>心情</span><div class="track"><div class="fill"></div></div></div>
          <div class="need panel" data-need="clean"><span>清潔</span><div class="track"><div class="fill"></div></div></div>
          <div class="need panel" data-need="energy"><span>精力</span><div class="track"><div class="fill"></div></div></div>
        </div>
      </div>
      <div id="bubble"></div>
      <div id="toast" class="panel"></div>
      <div id="evcard" class="panel" data-testid="evcard"><canvas id="evicon" width="32" height="32" data-testid="evicon"></canvas><b id="evname"></b><span id="evtext"></span><small id="evgain"></small></div>
      <div id="pop" class="panel"></div>
      <div id="bar">
        <div class="abtn panel" id="btn-feed" data-testid="feed"><canvas width="10" height="10"></canvas>餵食</div>
        <div class="abtn panel" id="btn-play" data-testid="play"><canvas width="10" height="10"></canvas>玩耍</div>
        <div class="abtn panel" id="btn-clean" data-testid="clean"><canvas width="10" height="10"></canvas>清潔</div>
        <div class="abtn panel" id="btn-sleep" data-testid="sleep"><canvas width="10" height="10"></canvas><span>關燈</span></div>
      </div>
      <div id="mgHud"><div class="panel" id="mgScore">分數 0</div> <div class="panel" id="mgTime" style="margin-left:6px">45</div>
        <div id="mgQuit" class="panel" data-testid="mg-quit">離開</div></div>
      <div id="mgMsg"></div>
      <div id="dbgT" class="panel" data-testid="dbg-toggle">DBG</div>
      <div id="dbg" class="panel"></div>
      <div id="modal"><div id="mbox" class="panel"></div></div>
    </div>
  </div>
</div>
<script src="src/data.js"></script>
<script src="src/sim.js"></script>
<script src="src/lighting.js"></script>
<script src="src/events.js"></script>
<script src="src/behavior.js"></script>
<script src="src/audio.js"></script>
<script src="src/render.js"></script>
<script src="src/hd2d.js"></script>
<script src="src/systems.js"></script>
<script src="src/sys12ui.js"></script>
<script src="src/ui.js"></script>
<script src="src/devpanel.js"></script>
<script src="src/main.js"></script>
<div id="rotate" data-testid="rotate"><div class="ph"></div><b>請轉直向</b><small style="font-size:13px;opacity:.75">《微光小圃》只支援直向畫面</small></div>
</body>
</html>
