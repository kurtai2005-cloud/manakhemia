<!doctype html>
<html lang="zh-HK"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>微光小圃 × from_ref 手感測試</title>
<style>
html,body{margin:0;height:100%;background:#0d0b16;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:absolute;left:0;right:0;bottom:0;height:calc(44/422*100%);display:flex;align-items:center;justify-content:space-between;padding:0 4%;box-sizing:border-box;font:600 14px/1.2 "Noto Sans CJK TC","PingFang HK","Microsoft JhengHei",sans-serif;color:#fff6e4;text-shadow:0 1px 0 #2a1f3a}
#ui button{font:inherit;color:#fff6e4;background:rgba(40,30,70,.55);border:2px solid rgba(255,240,200,.55);border-radius:10px;padding:6px 10px}
#name{text-align:center;flex:1}
#name small{display:block;font-size:11px;opacity:.75;font-weight:400}
#hint{position:absolute;left:0;right:0;top:3%;text-align:center;font:12px sans-serif;color:#fff6e4;opacity:.8;text-shadow:0 1px 0 #000}
</style></head><body>
<div id="wrap"><canvas id="c" width="195" height="422"></canvas>
<div id="hint">輕按畫面換寵物 · 下面掣換時段／尺寸（64·80·96）</div>
<div id="ui"><button id="prev">◀</button><div id="name"></div><button id="tod">時段</button><button id="sz">80px</button><button id="next">▶</button></div></div>
<script src="data.js"></script>
<script>
// 《微光小圃》HD-2D canvas2D 疊層（跟 scenes/hd2d/FORMAT.md §2）＋ from_ref/tuned 寵物
const F = window.FEEL, Q = new URLSearchParams(location.search);
const AW = F.art[0], AH = F.art[1], OX = F.off[0], OY = F.off[1];
const cv = document.getElementById('c'), ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
const SCN = ['H1', 'H2', 'H3', 'H4'];
let si = Math.max(0, SCN.indexOf(Q.get('scene') || 'H1'));
let pi = Math.max(0, F.pets.findIndex(p => p.key === (Q.get('pet') || 'A1')));
const SIZES = [48, 64, 80, 96];
let SZ = SIZES.includes(+Q.get('size')) ? +Q.get('size') : 48;   // 正式版改返舊寵尺寸 48px（Kurt [pt98u]）
const FIXT = Q.has('t') ? parseFloat(Q.get('t')) : null;
if (Q.get('ui') === '0') { document.getElementById('ui').style.display = 'none'; }
if (Q.has('t') || Q.get('hint') === '0') document.getElementById('hint').style.display = 'none';
const img = s => { const i = new Image(); i.src = s; return i; };
const LAY = ['sky', 'far', 'mid', 'fore', 'lightmap', 'light_add', 'emissive_blur', 'vignette'];
const S = {}; SCN.forEach(h => { S[h] = {}; LAY.forEach(l => S[h][l] = img(`assets/scenes/${h}/${l}.png`)); });
const PS = {}; SIZES.forEach(z => PS[z] = F.pets.map(p => img(`assets/pets${z}/${p.key}_idle.png`)));
function fit() {
  const k = Math.max(1, Math.floor(Math.min(innerWidth / AW, innerHeight / AH)));
  cv.style.width = AW * k + 'px'; cv.style.height = AH * k + 'px';
  const w = document.getElementById('wrap'); w.style.width = AW * k + 'px'; w.style.height = AH * k + 'px';
  document.getElementById('ui').style.fontSize = (7 * k) + 'px';
}
addEventListener('resize', fit); fit();
// 寵物 tint cache：sprite × petTint × ambientTint（FORMAT §2）
const tintCache = {};
function petFrame(pidx, fr, h) {
  const key = SZ + ':' + pidx + ':' + fr + ':' + h, Z = SZ, P = PS[Z]; if (tintCache[key]) return tintCache[key];
  const c = document.createElement('canvas'); c.width = Z; c.height = Z; const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  x.drawImage(P[pidx], fr * Z, 0, Z, Z, 0, 0, Z, Z);
  const g = F.scenes[h];
  x.globalCompositeOperation = 'multiply'; x.fillStyle = g.petTint; x.fillRect(0, 0, Z, Z); x.fillStyle = g.ambientTint; x.fillRect(0, 0, Z, Z);
  x.globalCompositeOperation = 'destination-in'; x.drawImage(P[pidx], fr * Z, 0, Z, Z, 0, 0, Z, Z);
  return tintCache[key] = c;
}
const hexA = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
// 粒子：寵物周圍慢慢升嘅光點（lighter）
let parts = []; let swap = 0;
function spawn(t, burst) {
  const p = F.pets[pi];
  parts.push({ x: F.foot[0] + (Math.random() - .5) * 46 * SZ / 64, y: F.foot[1] - 6 - Math.random() * 40 * SZ / 64, vx: (Math.random() - .5) * 3, vy: -3 - Math.random() * 4, born: t, life: 2.5 + Math.random() * 2, c: p.glow, s: Math.random() < .3 ? 2 : 1, burst });
}
function rnd(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
if (FIXT !== null) { const r = rnd(7 + pi * 13 + si); for (let i = 0; i < 10; i++) { const p = F.pets[pi]; parts.push({ x: F.foot[0] + (r() - .5) * 46 * SZ / 64, y: F.foot[1] - 6 - r() * 44 * SZ / 64, vx: 0, vy: 0, born: FIXT - r() * 2, life: 4, c: p.glow, s: r() < .3 ? 2 : 1 }); } }
function draw(t) {
  const h = SCN[si], L = S[h], g = F.scenes[h], pet = F.pets[pi], ZS = F.sizes[SZ], K = SZ / 64, bulb = ZS.bulb[pet.key], piv = ZS.pivot;
  const sway = Math.sin(t * 0.35) * 5;   // 模擬手機微傾嘅視差
  const off = l => [Math.round(-OX + sway * F.parallax[l]), -OY];
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.drawImage(L.sky, ...off('sky')); ctx.drawImage(L.far, ...off('far')); ctx.drawImage(L.mid, ...off('mid'));
  const mo = off('mid'), mx = mo[0] + OX;
  // 腳底影
  ctx.fillStyle = 'rgba(30,20,40,0.28)'; ctx.beginPath(); ctx.ellipse(F.foot[0] + mx, F.foot[1] + 1, 17 * K, 3.5 * K, 0, 0, Math.PI * 2); ctx.fill();
  // idle 幀（0 原、1 壓 1px、2 原、3 眨眼）＋ 偶爾停多陣
  // idle：0.9s 一下 bob（幀 1 壓 1px），約 3.3s 眨一次眼（幀 3）
  let fr = (t % 0.9) < 0.36 ? 1 : 0; if (fr === 0 && ((t + pi * 0.7) % 3.3) < 0.14) fr = 3;
  const hop = (t - swap < 0.25) ? -Math.round(Math.sin((t - swap) / 0.25 * Math.PI) * 4) : 0;
  const px = F.foot[0] - piv[0] + mx, py = F.foot[1] - piv[1] + hop;
  ctx.drawImage(petFrame(pi, fr, h), px, py);
  ctx.drawImage(L.fore, ...off('fore'));
  ctx.globalCompositeOperation = 'multiply'; ctx.drawImage(L.lightmap, ...mo);
  ctx.globalCompositeOperation = 'lighter'; ctx.drawImage(L.light_add, ...mo);
  ctx.globalAlpha = Math.min(1, g.bloom.intensity); ctx.drawImage(L.emissive_blur, ...mo); ctx.globalAlpha = 1;
  // 燈泡 glow（radial，呼吸）
  const bx = px + bulb[0] + .5, by = py + bulb[1] + (fr === 1 && bulb[1] < SZ * 0.625 ? 1 : 0) + .5, gr = 11 * K, pulse = .42 + .18 * Math.sin(t * 2.2);
  const rg = ctx.createRadialGradient(bx, by, 0, bx, by, gr); rg.addColorStop(0, hexA(g.bulbGlowTint, pulse)); rg.addColorStop(1, hexA(g.bulbGlowTint, 0));
  ctx.fillStyle = rg; ctx.fillRect(bx - gr, by - gr, gr * 2, gr * 2);
  // 粒子
  if (FIXT === null && Math.random() < 0.06) spawn(t);
  parts = parts.filter(q => t - q.born < q.life);
  for (const q of parts) {
    const a = t - q.born, k = a / q.life, al = Math.sin(k * Math.PI) * (q.burst ? .9 : .6);
    ctx.fillStyle = hexA(q.c, al); ctx.fillRect(Math.round(q.x + q.vx * a + mx), Math.round(q.y + q.vy * a), q.s, q.s);
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = g.fog.density; ctx.fillStyle = g.fog.color; ctx.fillRect(0, 0, AW, AH); ctx.globalAlpha = 1;
  ctx.drawImage(L.vignette, 0, 0);
}
function setName() { const p = F.pets[pi]; document.getElementById('name').innerHTML = `${p.key} ${p.name}<small>${F.scenes[SCN[si]].name}（${SCN[si]}）· ${SZ}px</small>`; document.getElementById('sz').textContent = SZ + 'px'; }
function nextPet(d, t) { pi = (pi + d + F.pets.length) % F.pets.length; swap = t; for (let i = 0; i < 10; i++) spawn(t, true); setName(); }
let now = 0;
cv.addEventListener('pointerdown', () => nextPet(1, now));
document.getElementById('next').onclick = () => nextPet(1, now);
document.getElementById('prev').onclick = () => nextPet(-1, now);
document.getElementById('sz').onclick = () => { SZ = SIZES[(SIZES.indexOf(SZ) + 1) % SIZES.length]; swap = now; setName(); };
document.getElementById('tod').onclick = () => { si = (si + 1) % 4; setName(); };
addEventListener('keydown', e => { if (e.key === 'ArrowRight') nextPet(1, now); if (e.key === 'ArrowLeft') nextPet(-1, now); if (e.key === 's') { SZ = SIZES[(SIZES.indexOf(SZ) + 1) % SIZES.length]; swap = now; setName(); } if (e.key === 't') { si = (si + 1) % 4; setName(); } });
setName();
let t0 = null;
function loop(ts) { if (t0 === null) t0 = ts; now = FIXT !== null ? FIXT : (ts - t0) / 1000; draw(now); requestAnimationFrame(loop); }
Promise.all([...Object.values(S).flatMap(o => Object.values(o)), ...Object.values(PS).flat()].map(i => i.decode().catch(() => 0))).then(() => requestAnimationFrame(loop));
</script></body></html>
